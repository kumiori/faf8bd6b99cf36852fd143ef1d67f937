name: Game-Gamer compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    name: Game-Gamer compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate checked-in upgrade
        env:
          PYTHONPATH: .github/game-gamer
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json,pathlib; lock=json.load(open("config/game-gamer-release.json")); report=pathlib.Path("docs/upgrades/game-gamer-"+lock["version"]+"/compatibility.json"); assert report.exists(), "No reviewed upgrade evidence"; pathlib.Path("/tmp/proposal.json").write_text(report.read_text())'
          python -m release.compatibility --root . --proposal /tmp/proposal.json --output "$RUNNER_TEMP/compatibility"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-gamer-compatibility
          path: ${{ runner.temp }}/compatibility/
