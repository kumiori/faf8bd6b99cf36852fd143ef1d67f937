  replay_consistent_true: 'REPLAY CONSISTENT: True'
  replay_identical: 'REPLAY IDENTICAL:'
  saddle_pathways_explicit_synthetic_hot: SADDLE PATHWAYS / EXPLICIT SYNTHETIC HOT-SEAT DEMONSTRATION
  the_commons_game_synthetic_demonstration: THE COMMONS GAME · {scenario} · synthetic demonstration
  world_started: 'World started: {scenario} · {db}'
commands:
  actions:
    help: Shows actions permitted by the engine for your current simulated actor; explains empty results.
  back:
    help: Return to the previous screen without changing state.
  connect:
    grammar: '[person]'
    help: Propose contact inside the simulated game. It sends no real message and creates no contract.
  contracts:
    grammar: '[actor=... status=... objective=... resource=...]'
    help: Browse all contracts, or the selected person's contracts. No ID is required.
    label: Contract registry
  ecosystem:
    help: Explore the current world; does not start or reset a simulation.
    label: Ecosystem mode
  gathering:
    help: Inspect collective event conditions in the same world.
    label: Gathering mode
  help:
    help: All listed commands have handlers; unavailable actions give a reason.
    label: Contextual help
  history:
    help: Choose a transition to inspect its historical graph; return to recover the current world.
    label: Selected object history
  inbox:
    help: Proposals, amendments and obligations requiring this actor's attention.
    label: Contract inbox
  invite:
    help: Only worlds with a gathering objective support invitations. Other worlds explain why it is unavailable.
    label: Invite to a gathering
  list:
    help: Return to the typed graph projection of the current authoritative state.
    label: World explorer
  metadata:
    help: Show source IDs and capture metadata on demand. Raw questionnaire answers and contact information are
      never imported.
    label: Source and technical details
  object_grammar: '[object]'
  open:
    grammar: '[name, number or contract reference]'
    help: Enter or a number inspects an item. open latest contract finds the newest proposal in this world.
    label: Inspect selected object
  past:
    grammar: '[state number] [object]'
    help: Without arguments, opens a history selector. past 3 K-001 inspects a particular state.
    label: Historical graph
  paths:
    help: Choose a mode in the same saved world.
    label: Choose a path
  player:
    help: Select another catalogue person. This changes perspective, never the shared world or real authority.
    label: Change simulated player
  quit:
    help: Accepted events are already persisted. Quitting does not reset the world.
    label: Quit and save
  replay:
    help: Reconstruct the authoritative log without changing the saved world.
    label: Check saved history
  respond:
    help: Choose a pending invitation or a contract requiring your response.
    label: Respond to pending items
  scenarios:
    help: Explore strategy and agreement possibilities without changing worlds.
    label: Scenarios mode
  search:
    grammar: '[text]'
    help: / followed by a name filters the catalogue. / alone asks for a search term.
    label: Search by name
  trajectory:
    help: Inspect recorded transitions through the pinned trajectory adapter. This is recorded simulation history,
      not an alternative experiment.
    label: Recorded trajectory
