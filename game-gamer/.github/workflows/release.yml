name: Game-Gamer release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools==75.6.0 wheel==0.45.1 pytest==8.4.2 wcwidth==0.2.13 PyYAML==6.0.2
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest -q -p no:cacheprovider
      - name: Build exact tagged source
        run: |
          python -c 'import os,tomllib; from pathlib import Path; assert os.environ["GITHUB_REF_NAME"] == "v"+tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]'
          python -m release.bundle --source . --output "$RUNNER_TEMP/release" --source-commit "$GITHUB_SHA"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: python -m release.publish "$RUNNER_TEMP/release"
