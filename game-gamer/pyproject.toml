[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-gamer"
version = "0.2.0"
description = "A UI-independent engine for collective decision-making"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
game-gamer = "game_gamer.cli:main"

[project.optional-dependencies]
tui = ["wcwidth>=0.2.12,<1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"game_gamer.exercises" = ["*.json"]
