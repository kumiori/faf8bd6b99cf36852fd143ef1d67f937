[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-game"
version = "0.1.0"
description = "A shared authoritative engine for experiments in collective agency"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
commons = "commons_game.__main__:main"

[tool.setuptools.packages.find]
include = ["commons_engine*", "commons_game*"]

[tool.setuptools.package-data]
commons_game = ["scenarios/*.json", "web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
